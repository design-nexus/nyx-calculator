[workspace]
resolver = "3"
members = [
    "crates/calculator-app",
    "crates/calculator-core",
    "crates/calculator-graph",
    "crates/calculator-storage",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nyx-calculator"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gio = "0.22"
glib = "0.22"
gdk = { package = "gdk4", version = "0.11" }
pangocairo = "0.22"
cairo-rs = "0.22"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
async-channel = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }

[profile.release]
lto = "thin"
strip = true
