[workspace]
resolver = "3"
members = [
    "crates/calculator-app",
    "crates/calculator-core",
    "crates/calculator-graph",
    "crates/calculator-storage",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nyx-calculator"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gio = "0.22"
glib = "0.22"
gdk = { package = "gdk4", version = "0.11" }
pangocairo = "0.22"
cairo-rs = "0.22"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
async-channel = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6b2550bf06ea0d8c8c7e52cff03d4236d46d9777" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6b2550bf06ea0d8c8c7e52cff03d4236d46d9777" }

[profile.release]
lto = "thin"
strip = true
